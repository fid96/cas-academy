<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="SIG Atelier — socle commun avec parcours Data Analyst et Expert S&E. Cas Kalunga WASH, QC GPS, QGIS guidé." />
  <title>SIG Atelier — Data Analyst &amp; S&amp;E</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    :root {
      --leaf: #1a5f6a;
      --forest: #0f3d45;
      --mint: #7eb8b0;
      --amber: #c17f2a;
      --amber-deep: #9a6218;
      --sky: #2f6b7a;
    }
    .brand-mark { background: linear-gradient(135deg, #1a5f6a, #c17f2a); }
    .case-banner {
      background: linear-gradient(135deg, #0f3d45, #1e2f3d);
      color: #e8f2f0;
      border-radius: 16px;
      padding: 1rem 1.15rem;
      margin: 1rem 0 1.5rem;
    }
    .case-banner strong { color: #f0d78a; }
    .pack-chip {
      display: inline-block;
      margin: 0.35rem 0 0.75rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: rgba(26, 95, 106, 0.12);
      color: var(--forest);
      border: 1px solid rgba(26, 95, 106, 0.25);
    }
    .studio-card {
      background: #fff;
      border: 1px solid rgba(14,36,51,0.12);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.85rem;
    }
    .studio-card h3 { margin: 0 0 0.4rem; }
    .ph {
      width: 100%;
      aspect-ratio: 16/10;
      border-radius: 14px;
      background:
        linear-gradient(145deg, rgba(26,95,106,0.22), rgba(193,127,42,0.14)),
        #d5e4e6;
      display: grid;
      place-items: center;
      color: #2f6b7a;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .check-item {
      display: flex; gap: 0.6rem; align-items: flex-start;
      padding: 0.55rem 0.2rem; border-bottom: 1px solid #e6eef3;
      font-size: 0.95rem;
    }
    .lab-selects {
      display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 0.75rem 0 1rem;
      align-items: center;
    }
    .lab-selects select, .lab-selects button, .lab-selects a.btn {
      font: inherit; padding: 0.55rem 0.75rem; border-radius: 10px;
    }
    .lab-selects select { border: 1px solid #c5d4df; background: #fff; }
    body[data-pack="se"] .brand-mark {
      background: linear-gradient(135deg, #1f5c4a, #b08930);
    }
    body[data-pack="se"] {
      --leaf: #1f5c4a;
      --forest: #143d33;
      --mint: #7eb89f;
      --sky: #3d5a61;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>
  <header class="site-header">
    <div class="header-inner">
      <button type="button" class="brand" data-nav="home" aria-label="Accueil">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">SIG Atelier</span>
      </button>
      <nav class="site-nav" aria-label="Navigation principale">
        <button type="button" data-nav="home">Accueil</button>
        <button type="button" data-nav="parcours">Parcours</button>
        <button type="button" data-nav="methode">Méthode</button>
        <button type="button" data-nav="labo">Labo SIG</button>
        <button type="button" data-nav="carnet">Carnet</button>
        <button type="button" data-nav="bilan">Quiz bilan</button>
        <button type="button" data-nav="glossaire">Glossaire</button>
      </nav>
      <div class="header-progress" title="Progression">
        <span class="progress-label">Progression</span>
        <div class="progress-track"><div class="progress-fill" id="global-progress-fill"></div></div>
        <span class="progress-value" id="global-progress-value">0%</span>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <footer class="site-footer">
    <p id="footer-brand"><strong>SIG Atelier</strong> — un socle, deux parcours métier.</p>
    <p class="footer-note" id="footer-note">Cas fil rouge : <strong>Kalunga</strong> — Nutrition &amp; WASH.</p>
  </footer>
  <script src="js/content.js"></script>
  <script src="js/sig-lab.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
